# ===============================================================
# Voxelab Aquila (Creality V4/F407 Board) - Klipper Configuration
# ===============================================================
# Bed size: 220x220 mm, max height: 250 mm
# MCU: STM32F407 (not H32/GD32!)
# ===============================================================

[include mainsail.cfg]
[include timelapse.cfg]
[include macros.cfg]
[include KAMP_Settings.cfg]
#https://docs.vorondesign.com/community/howto/EricZimmerman/BackupConfigToGithub.html
[include config_backup.cfg]

[virtual_sdcard]
path: ~/printer_data/gcodes

[exclude_object]

[gcode_arcs]
resolution: 0.1

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
minimum_cruise_ratio: 0.5
max_z_velocity: 5
square_corner_velocity: 5.0
max_z_accel: 100

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6  # This is correct according to pins_VOXELAB_V110.h
position_endstop: 0
position_min: 0
position_max: 255
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA7  # Changed to PA7 - correct Y endstop pin
position_endstop: -8
position_min: -8
position_max: 236
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
endstop_pin: ^PC4  # Changed from PA4 to PC4 (correct Z endstop pin)
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16
full_steps_per_rotation: 200

position_endstop: 0      
position_max: 250
position_min: -5

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA5  # Correct according to pins_VOXELAB_V110.h (TEMP_0_PIN)
min_temp: 0
max_temp: 250
control: pid
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA4  # Correct according to pins_VOXELAB_V110.h (TEMP_BED_PIN)
min_temp: 0
max_temp: 100
control: pid
pid_Kp: 54.0
pid_Ki: 0.770
pid_Kd: 948.0

[fan]  # Part cooling fan
pin: PA2

[heater_fan hotend_fan]  # Hotend heatsink fan
pin: PA14
heater: extruder
heater_temp: 50.0

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_speed: 35


# [bltouch]
# sensor_pin: ^PB1
# control_pin: PB0
# x_offset: -36
# y_offset: -36
# speed:10
# samples:5
# samples_result:average
# probe_with_touch_mode: true
# stow_on_each_sample: false

[safe_z_home]
home_xy_position: 143.5,153.5
speed: 100
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 33,33
mesh_max: 193,193
probe_count: 5,5
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2

[screws_tilt_adjust]
screw1: 64, 74
screw1_name: front left screw
screw2: 224, 74
screw2_name: front right screw
screw3: 224, 234
screw3_name: rear right screw
screw4: 64, 234 
screw4_name: rear left screw
speed: 100
horizontal_move_z: 10
screw_thread: CW-M3
